<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1735px" preserveAspectRatio="none" style="width:644px;height:1735px;background:#FFFFFF;" version="1.1" viewBox="0 0 644 1735" width="644px" zoomAndPan="magnify"><title>Primary Purchase Activity - Ticketing + Payment Orchestrator</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="448.9434" x="96.5049" y="33.5352">Primary Purchase Activity - Ticketing + Payment Orchestrator</text></g><ellipse cx="247.8264" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.0781" x="123.2874" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.5332" x="133.2874" y="109.0898">Buyer app loads active events</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.0781" x="133.2874" y="123.2227">through API Gateway and event-service</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.0566" x="142.2981" y="155.7539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.0566" x="152.2981" y="177.3555">Buyer chooses event, ticket type,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73.2129" x="152.2981" y="191.4883">and quantity</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="168.5176" x="163.5676" y="224.0195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.5176" x="173.5676" y="245.6211">Ticketing service receives</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.002" x="173.5676" y="259.7539">POST /tickets/reserve</text><polygon fill="#F1F1F1" points="195.6301,292.2852,300.0227,292.2852,312.0227,304.2852,300.0227,316.2852,195.6301,316.2852,183.6301,304.2852,195.6301,292.2852" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="104.3926" x="195.6301" y="308.4424">Inventory available?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="166.1472" y="301.9648">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="312.0227" y="301.9648">no</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.125" x="32.8196" y="326.2852"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.125" x="42.8196" y="347.8867">Lock inventory in ticket_inventory</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="180.2363" x="50.7639" y="394.5508"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.2363" x="60.7639" y="416.1523">Create reservation with TTL</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="171.6523" x="268.9446" y="326.2852"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.1719" x="278.9446" y="347.8867">Return validation or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.6523" x="278.9446" y="362.0195">INSUFFICIENT_INVENTORY</text><ellipse cx="354.7708" cy="419.6836" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="354.7708" cy="419.6836" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="170.832" x="162.4104" y="450.6836"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.832" x="172.4104" y="472.2852">Buyer app starts checkout</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="168.5176" x="163.5676" y="504.8164"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.5176" x="173.5676" y="526.418">Ticketing service receives</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.7305" x="173.5676" y="540.5508">POST /tickets/purchase</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="250.8652" x="122.3938" y="573.082"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.8652" x="132.3938" y="594.6836">Reservation becomes payment_pending</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="195.3301" x="150.1614" y="627.2148"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.3301" x="160.1614" y="648.8164">Payment orchestrator receives</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142.9219" x="160.1614" y="662.9492">POST /payments/intents</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.9395" x="158.8567" y="695.4805"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.9395" x="168.8567" y="717.082">Persist payment_intent and</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.6523" x="168.8567" y="731.2148">return paymentUrl</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="267.5996" x="114.0266" y="763.7461"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.5996" x="124.0266" y="785.3477">Buyer completes MoMo or VNPay checkout</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="251.8145" x="121.9192" y="817.8789"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.8145" x="131.9192" y="839.4805">Payment orchestrator receives webhook</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="185.2871" x="155.1829" y="872.0117"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.2871" x="165.1829" y="893.6133">Verify signature, timestamp,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.5918" x="165.1829" y="907.7461">nonce, and dedupe</text><polygon fill="#F1F1F1" points="165.4526,940.2773,330.2002,940.2773,342.2002,952.2773,330.2002,964.2773,165.4526,964.2773,153.4526,952.2773,165.4526,940.2773" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="164.7476" x="165.4526" y="956.4346">Webhook accepted on first try?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="135.9697" y="949.957">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="342.2002" y="949.957">no</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="165.9512" x="11" y="974.2773"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.9512" x="21" y="995.8789">Mark payment confirmed</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="165.0137" x="319.1704" y="974.2773"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.0137" x="329.1704" y="995.8789">Insert payment_retry_job</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="171.2539" x="316.0503" y="1028.4102"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.2539" x="326.0503" y="1050.0117">Wait for reconciliation run</text><polygon fill="#F1F1F1" points="359.6484,1082.543,443.7061,1082.543,455.7061,1094.543,443.7061,1106.543,359.6484,1106.543,347.6484,1094.543,359.6484,1082.543" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="84.0576" x="359.6484" y="1098.7002">Retry succeeds?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="330.1655" y="1092.2227">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="455.7061" y="1092.2227">no</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="165.9512" x="206.9512" y="1116.543"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.9512" x="216.9512" y="1138.1445">Mark payment confirmed</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="241.0508" x="392.9023" y="1116.543"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="221.0508" x="402.9023" y="1138.1445">Leave payment unresolved or rejected</text><ellipse cx="513.4277" cy="1181.6758" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="513.4277" cy="1181.6758" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="247.8264,1202.6758,259.8264,1214.6758,247.8264,1226.6758,235.8264,1214.6758,247.8264,1202.6758" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="200.6211" x="147.5159" y="1246.6758"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.7051" x="157.5159" y="1268.2773">Issue expiring payment_hash</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.6211" x="157.5159" y="1282.4102">for TicketLedger purchase flow</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="299.0117" x="98.3206" y="1314.9414"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.5176" x="108.3206" y="1336.543">Ticketing service receives</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="279.0117" x="108.3206" y="1350.6758">POST /tickets/purchase/{reservationId}/confirm</text><polygon fill="#F1F1F1" points="192.5176,1383.207,303.1353,1383.207,315.1353,1395.207,303.1353,1407.207,192.5176,1407.207,180.5176,1395.207,192.5176,1383.207" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="110.6177" x="192.5176" y="1399.3643">Reservation expired?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="163.0347" y="1392.8867">yes</text><text fill="#000000" font-family="sans-serif" font-size="1